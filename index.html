<style>
:root{
  --bg:#EFF1EE; --surface:#FFFFFF; --ink:#1E2328; --muted:#5F666D; --line:#D6DAD5;
  --a:#C3313B; --b:#2C64AE; --ok:#2D7D52; --warn:#B4231B; --warn-bg:#FBE9E7;
  --unit:var(--a);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15181B; --surface:#1F2327; --ink:#E7EAEC; --muted:#9AA1A8; --line:#353B41;
    --a:#E5626A; --b:#6C9BE0; --ok:#5BBF86; --warn:#FF8A80; --warn-bg:#3A1F1D;
    color-scheme:dark;
  }
}
body.unit-B{--unit:var(--b)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:130px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--unit);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:20px}
nav button{flex:1;border:0;background:none;color:var(--muted);font-weight:700;padding:9px;border-radius:999px;cursor:pointer}
nav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
h1{font-size:1.6rem;line-height:1.15;margin:0}
h2{font-size:1.15rem;margin:0 0 2px}
.meta{color:var(--muted);font-size:.88rem}
.small{color:var(--muted);font-size:.9rem;margin-top:20px}
.status{color:var(--muted);font-size:.88rem;min-height:1.2em;margin:8px 0 0}

/* Start */
.hero{padding:4px 0 12px}
.hero .kicker{margin:0;color:var(--muted);font-weight:600}
.hero .letter{font-size:clamp(150px,44vw,220px);font-weight:800;line-height:.82;color:var(--unit);letter-spacing:-.05em;margin:4px 0 10px}
.hero p{margin:0 0 4px;color:var(--muted)}

.btn{display:flex;align-items:center;justify-content:center;border:0;border-radius:14px;padding:14px 20px;font-weight:700;cursor:pointer;background:var(--unit);color:#fff;min-height:50px}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);min-height:44px;padding:10px 14px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:12px 4px;display:block}
.link.danger{color:var(--warn)}

.field{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}
.field.col{flex-direction:column;align-items:stretch;gap:6px}
.field > span{font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:10px 16px;min-height:44px;cursor:pointer;font-weight:600}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--unit);color:#fff}

/* Session */
.sess-head{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.sess-head .letter-sm{font-size:68px;font-weight:800;line-height:.9;color:var(--unit);letter-spacing:-.04em}
.painbtn{width:100%;border:1.5px solid var(--warn);color:var(--warn);background:transparent;border-radius:12px;padding:11px;font-weight:700;cursor:pointer;margin:6px 0}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:16px;padding:16px;margin:12px 0;font-weight:600}
.group{margin:26px 0 8px}
.group .sub{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.row{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.row.done{border-left-color:var(--ok)}
.row .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.row .name{font-weight:700}
.last{font-size:.86rem;color:var(--muted);margin-top:3px}
.up{color:var(--ok);font-weight:700}
.ctrl{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{width:46px;height:46px;border:0;background:transparent;font-size:1.35rem;cursor:pointer}
.stepper output{min-width:42px;text-align:center;font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}
.loadwrap{display:flex;align-items:center;gap:6px}
.load{width:84px;height:46px;border:1px solid var(--line);border-radius:12px;background:transparent;padding:0 10px}
.variant{margin-top:10px;width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 10px}
.check{margin-left:auto;width:50px;height:50px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;font-size:1.3rem;font-weight:800;color:var(--muted)}
.row.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:16px 0}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:transparent;resize:vertical}
.warntext{color:var(--warn);font-weight:600}

/* History */
.hist-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
details.hist summary{display:flex;gap:14px;align-items:center;cursor:pointer;list-style:none}
details.hist summary::-webkit-details-marker{display:none}
.hl{font-size:2.4rem;font-weight:800;line-height:1;min-width:1.2ch}
.detail{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:.95rem}
.detail div{margin:3px 0}
.note{color:var(--muted);font-style:italic}
.empty{padding:30px 0}
.empty p{color:var(--muted)}

/* Sicherung */
.backup h2{margin-bottom:4px}
.backup .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.backup .btns .btn{flex:1}
.hint{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--unit);border-radius:14px;padding:12px 14px;margin:0 0 16px;font-size:.92rem}
.hint.bad{border-left-color:var(--warn);color:var(--warn);font-weight:600}
input[type=file]{display:none}
.card .field{flex-direction:column;align-items:stretch;gap:6px}
.card .seg button{flex:1;padding:10px 8px}

/* Timer */
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);
  padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px}
.timer[hidden]{display:none}
.timer .tinfo{flex:1;min-width:0}
.timer .t{font-size:2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.timer .tl{font-size:.85rem;opacity:.8}
.timer button{background:transparent;border:1px solid currentColor;border-radius:10px;padding:9px 12px;cursor:pointer;color:inherit;font-weight:600}
.tbar{position:absolute;top:0;left:0;right:0;height:5px}
#tfill{display:block;height:100%;width:0;background:var(--unit)}
</style>
</head>
<body class="unit-A">
<div class="wrap">
  <nav aria-label="Bereiche">
    <button data-act="view" data-v="today">Training</button>
    <button data-act="view" data-v="history">Verlauf</button>
  </nav>
  <main id="main"><p class="meta">Lädt …</p></main>
  <p id="status" class="status" role="status"></p>
</div>
<div id="timer" class="timer" hidden></div>

<script>
const KEY = 'physio-tracker-v1';
let data = { sessions: [], active: null };
let view = 'today';
let startRounds = 2;
let startLoc = 'home';
let timer = null, tick = null, actx = null;
let armed = null;          // zweistufiges Bestätigen (Löschen/Verwerfen)
let exportText = null;
const openIds = new Set();

const EX = {
  legpress: { name:'Beinpresse', machine:true, load:'kg' },
  squat:    { tools:true, name:'Squats', hint:'Band um die Knie, Gewicht vor dem Körper', load:'kg' },
  rdl:      { tools:true, name:'RDL', hint:'Kreuzheben mit gestreckten Beinen', load:'kg', perSideWith:['Kurzhantel'], defLoad:'4', defTool:'Kurzhantel', home:{ load:'10', tool:'Kettlebell' } },
  calf:     { tools:true, name:'Wadenheben', load:'kg', variants:['beidbeinig','beidbeinig hoch, einbeinig runter','einbeinig'] },
  pallof:   { name:'Pallof Press', side:true, load:'Band/kg', text:true },
  foot:     { name:'Fuß nach außen gegen Theraband', side:true, load:'Band', text:true },
  stand:    { name:'Einbeinstand', side:true, time:true, variants:['Augen offen','Augen zu','weiche Unterlage'] },
  legcurl:  { name:'Leg Curls', machine:true, load:'kg' },
  lunge:    { tools:true, name:'Ausfallschritte nach vorne', side:true, load:'kg' },
  bridge:   { tools:true, name:'Bridges', hint:'Becken heben', load:'kg', variants:['beidbeinig','einbeinig'] },
  lateral:  { tools:true, name:'Seitheben', load:'kg', defLoad:'3' },
  kneeext:  { name:'Knee Extension', machine:true, load:'kg' }
};
const UNITS = {
  A: { pre:['legpress'], circuit:['squat','rdl','calf','pallof','foot','stand'], post:['legcurl'] },
  B: { pre:[], circuit:['lunge','bridge','lateral','calf','foot','stand'], post:['kneeext'] }
};
const allEx = u => [...UNITS[u].pre, ...UNITS[u].circuit, ...UNITS[u].post];
const TOOLS = ['Kurzhantel','Kettlebell','Langhantel','ohne Gewicht'];
// Gewichtseinheit: bei zwei Kurzhanteln pro Seite, sonst gesamt
const loadUnit = (id, e) => (EX[id].perSideWith || []).includes(e && e.tool) ? 'kg/Seite' : (EX[id].load || '');
const LOC = { home:'Daheim', gym:'Studio' };
const LOC_AT = { home:'daheim', gym:'im Studio' };
const locOf = s => s.loc || 'gym';   // ältere Einheiten ohne Ort zählen als Studio
const exFor = (u, loc) => loc === 'gym' ? allEx(u) : UNITS[u].circuit;

/* ---------- Hilfsfunktionen ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fmtDate = iso => new Date(iso).toLocaleDateString('de-AT', { weekday:'short', day:'numeric', month:'numeric', year:'2-digit' });
const isSide = (id, e) => EX[id].side || /einbeinig/.test(e.variant || '');
const unitTxt = id => EX[id].time ? 'Sek.' : 'Wdh.';

function setStatus(t){ document.getElementById('status').textContent = t; }

// In Claude: Artifact-Speicher. Als eigene Web-App: Browser-Speicher (localStorage).
const inClaude = !!(window.storage && typeof window.storage.get === 'function');
let storageOk = true;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

async function storeGet(){
  if (inClaude){ const r = await window.storage.get(KEY, false); return r && r.value ? r.value : null; }
  return localStorage.getItem(KEY);
}
async function storeSet(v){
  if (inClaude){ const r = await window.storage.set(KEY, v, false); if (!r) throw new Error('set failed'); return; }
  localStorage.setItem(KEY, v);
}
function normalize(d){
  return { sessions: Array.isArray(d.sessions) ? d.sessions : [], active: d.active || null, lastBackup: d.lastBackup || null };
}
async function loadData(){
  try{ const v = await storeGet(); if (v) data = normalize(JSON.parse(v)); }
  catch(e){ /* noch keine Daten */ }
  if (!inClaude){
    try{ localStorage.setItem(KEY + '-test', '1'); localStorage.removeItem(KEY + '-test'); }
    catch(e){ storageOk = false; }
    try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  }
}
let saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    try{ await storeSet(JSON.stringify(data)); storageOk = true; }
    catch(e){ storageOk = false; setStatus('Speichern fehlgeschlagen. Einträge bleiben nur, solange die Seite offen ist. Mach ein Backup.'); }
  }, 300);
}

/* ---------- Backup ---------- */
function backupFileName(){
  const d = new Date();
  return `training-backup-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
}
async function exportBackup(){
  const json = JSON.stringify({ app:'physio-tracker', version:1, exported:new Date().toISOString(), sessions:data.sessions, active:data.active }, null, 2);
  const name = backupFileName();
  const markDone = () => { data.lastBackup = new Date().toISOString(); save(); render(); };
  try{
    const file = new File([json], name, { type:'application/json' });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:'Trainings-Backup' });
      setStatus('Backup geteilt. Am besten in iCloud Drive oder Dateien sichern.');
      markDone(); return;
    }
  }catch(e){
    if (e && e.name === 'AbortError'){ setStatus('Backup abgebrochen.'); return; }
  }
  try{
    const url = URL.createObjectURL(new Blob([json], { type:'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    setStatus('Backup-Datei erstellt: ' + name);
    markDone();
  }catch(e){
    setStatus('Download nicht möglich. Bitte den Text unter „Für Lele zusammenfassen“ sichern.');
  }
}
function importBackup(file){
  const r = new FileReader();
  r.onload = () => {
    let d;
    try{ d = JSON.parse(r.result); }catch(e){ setStatus('Die Datei ist kein gültiges Backup (kein JSON).'); return; }
    if (!d || !Array.isArray(d.sessions)){ setStatus('Die Datei enthält keine Trainingsdaten.'); return; }
    const known = new Set(data.sessions.map(s => s.id));
    const fresh = d.sessions.filter(s => s && s.id && s.unit && s.entries && !known.has(s.id));
    data.sessions = [...data.sessions, ...fresh].sort((a, b) => new Date(a.date) - new Date(b.date));
    if (!data.active && d.active) data.active = d.active;
    save(); render();
    setStatus(fresh.length ? `${fresh.length} ${fresh.length===1?'Einheit':'Einheiten'} wiederhergestellt.` : 'Alle Einheiten aus dem Backup waren schon vorhanden.');
  };
  r.onerror = () => setStatus('Die Datei konnte nicht gelesen werden.');
  r.readAsText(file);
}
function daysSince(iso){ return iso ? Math.floor((Date.now() - new Date(iso)) / 86400000) : null; }
function backupCard(){
  const n = daysSince(data.lastBackup);
  const when = n === null ? 'Noch kein Backup gemacht.' : n === 0 ? 'Letztes Backup: heute.' : n === 1 ? 'Letztes Backup: gestern.' : `Letztes Backup: vor ${n} Tagen.`;
  const where = inClaude ? 'Die Daten liegen in deinem Claude-Konto.' : 'Die Daten liegen nur auf diesem Gerät.';
  return `<section class="card backup"><h2>Sicherung</h2>
    <p class="meta">${where} ${when} Ein Backup ist eine Datei mit allen Einheiten, die du z. B. in iCloud Drive ablegst. Beim Wiederherstellen werden fehlende Einheiten ergänzt, nichts wird überschrieben.</p>
    <div class="btns">
      <button class="btn" data-act="backup">Backup erstellen</button>
      <button class="btn ghost" data-act="restore">Backup wiederherstellen</button>
    </div>
    <input type="file" id="restoreFile" accept="application/json,.json"></section>`;
}
function storageHint(){
  if (!storageOk) return `<div class="hint bad">Hier kann nicht gespeichert werden. Öffne den Tracker über seine Webadresse in Safari, nicht aus der Dateien-App, und nicht im privaten Modus.</div>`;
  if (!inClaude && isIOS && !isStandalone) return `<div class="hint">Tipp: In Safari über Teilen → „Zum Home-Bildschirm“ hinzufügen und immer über das Icon öffnen. Sonst löscht Safari die Daten, wenn du die Seite 7 Tage nicht öffnest.</div>`;
  const n = daysSince(data.lastBackup);
  if (!inClaude && data.sessions.length >= 3 && (n === null || n >= 14)) return `<div class="hint">${n === null ? 'Du hast noch kein Backup.' : `Dein letztes Backup ist ${n} Tage alt.`} Unter „Verlauf“ kannst du eines erstellen.</div>`;
  return '';
}

function lastEntry(id, excludeId, loc){
  for (let i = data.sessions.length - 1; i >= 0; i--){
    const s = data.sessions[i];
    if (s.id === excludeId) continue;
    if (loc && locOf(s) !== loc) continue;
    const e = s.entries[id];
    if (e && e.sets.some(x => x.done)) return { e, s };
  }
  return null;
}
// "In allen Runden sauber 12" -> steigern
function reachedTop(id, e){
  if (EX[id].time) return false;
  const done = e.sets.filter(x => x.done);
  if (!done.length || !done.every(x => x.reps >= 12)) return false;
  return EX[id].machine ? done.length >= 2 : done.length === e.sets.length;
}
function nextUnit(){
  const last = data.sessions[data.sessions.length - 1];
  return last && last.unit === 'A' ? 'B' : 'A';
}
function weekCount(){
  const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return data.sessions.filter(s => new Date(s.date) >= d).length;
}

function newSession(unit, rounds, loc){
  const entries = {};
  exFor(unit, loc).forEach(id => {
    const ex = EX[id], prev = lastEntry(id, null, loc), anyPrev = lastEntry(id);
    let reps = ex.time ? 30 : 8, variant = ex.variants ? ex.variants[0] : '', load = ex.defLoad || '', tool = ex.defTool || '';
    if (loc === 'home' && ex.home){ load = ex.home.load; tool = ex.home.tool; }
    // Variante (Schwierigkeit) ortsunabhängig, Gewicht und Wiederholungen pro Ort
    if (anyPrev && anyPrev.e.variant) variant = anyPrev.e.variant;
    if (prev){
      const p = prev.e;
      load = p.load ?? load;
      tool = p.tool || '';
      const d = p.sets.filter(x => x.done);
      if (d.length) reps = d[0].reps;
      if (reachedTop(id, p)) reps = 6;
    }
    const n = ex.machine ? 3 : rounds;
    entries[id] = { variant, load, tool, sets: Array.from({ length:n }, () => ({ reps, done:false })) };
  });
  return { id:uid(), unit, loc, date:new Date().toISOString(), rounds, warmup:false, entries, feel:'', pain:'', note:'', stopped:false };
}

function setRounds(s, n){
  s.rounds = n;
  UNITS[s.unit].circuit.forEach(id => {
    const sets = s.entries[id].sets;
    while (sets.length < n) sets.push({ reps: sets[sets.length - 1].reps, done:false });
    while (sets.length > n && !sets[sets.length - 1].done) sets.pop();
  });
}

/* ---------- Pausen-Timer ---------- */
function restFor(s, id, i){
  if (EX[id].machine) return { sec:120, label:'Pause bis zum nächsten Satz' };
  const c = UNITS[s.unit].circuit;
  if (c.indexOf(id) === c.length - 1){
    return i < s.rounds - 1 ? { sec:180, label:'Pause vor der nächsten Runde (2–4 Min.)' }
                            : (locOf(s) === 'gym' ? { sec:150, label:'Pause vor den Geräten' } : null);
  }
  return { sec:150, label:'Pause bis zur nächsten Übung (2–3 Min.)' };
}
function startTimer(r){
  timer = { end: Date.now() + r.sec * 1000, total: r.sec, label: r.label, rang:false };
  clearInterval(tick); tick = setInterval(updTimer, 250);
  renderTimer();
}
function stopTimer(){ timer = null; clearInterval(tick); renderTimer(); }
function renderTimer(){
  const el = document.getElementById('timer');
  if (!timer){ el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = `<div class="tbar"><i id="tfill"></i></div>
    <div class="tinfo"><div class="t" id="tval"></div><div class="tl">${esc(timer.label)}</div></div>
    <button data-act="tplus">+30 s</button><button data-act="tstop">Weiter</button>`;
  updTimer();
}
function updTimer(){
  if (!timer) return;
  const left = Math.max(0, Math.round((timer.end - Date.now()) / 1000));
  const tv = document.getElementById('tval'), f = document.getElementById('tfill');
  if (tv) tv.textContent = left > 0 ? `${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}` : 'Weiter geht’s';
  if (f) f.style.width = (100 * (1 - left / timer.total)) + '%';
  if (left === 0 && !timer.rang){ timer.rang = true; ding(); }
}
function ding(){
  try{
    if (navigator.vibrate) navigator.vibrate([200,100,200]);
    if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.frequency.value = 880;
    g.gain.setValueAtTime(.001, t);
    g.gain.exponentialRampToValueAtTime(.3, t + .02);
    g.gain.exponentialRampToValueAtTime(.001, t + .6);
    o.connect(g).connect(actx.destination); o.start(); o.stop(t + .65);
  }catch(e){}
}

/* ---------- Rendering ---------- */
function render(){
  const a = data.active;
  document.body.className = 'unit-' + (a ? a.unit : nextUnit());
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', String(b.dataset.v === view)));
  document.getElementById('main').innerHTML =
    view === 'history' ? renderHistory() : (a ? renderSession(a) : renderStart());
  renderTimer();
}

function roundsSeg(cur){
  return `<div class="seg">${[2,3].map(n => `<button data-act="rounds" data-n="${n}" aria-pressed="${cur===n}">${n}</button>`).join('')}</div>`;
}

function renderStart(){
  const u = nextUnit(), o = u === 'A' ? 'B' : 'A', w = weekCount();
  const last = data.sessions[data.sessions.length - 1];
  return `${storageHint()}<section class="hero">
      <p class="kicker">Nächste Einheit</p>
      <div class="letter" aria-hidden="true">${u}</div>
      <p>${w === 0 ? 'Diese Woche noch keine Einheit.' : `Diese Woche ${w} ${w===1?'Einheit':'Einheiten'}, Ziel sind 2–3.`}</p>
      ${last ? `<p>Zuletzt: Einheit ${last.unit} am ${fmtDate(last.date)}, ${LOC_AT[locOf(last)]}</p>` : ''}
    </section>
    <div class="field"><span>Ort</span><div class="seg">${Object.entries(LOC).map(([k,v]) => `<button data-act="loc" data-v="${k}" aria-pressed="${startLoc===k}">${v}</button>`).join('')}</div></div>
    <div class="field"><span>Runden im Zirkel</span>${roundsSeg(startRounds)}</div>
    <button class="btn wide" data-act="start" data-unit="${u}">Einheit ${u} starten</button>
    <button class="link" data-act="start" data-unit="${o}">Stattdessen Einheit ${o} machen</button>
    <p class="small">Saubere Ausführung geht vor Gewicht. Bei Schmerzen im Sprunggelenk aufhören und Lele Bescheid geben.</p>`;
}

function group(title, sub, inner){
  return `<section class="group"><h2>${title}</h2><p class="sub">${sub}</p>${inner}</section>`;
}

function row(s, id, i, first, label){
  const ex = EX[id], e = s.entries[id], set = e.sets[i];
  let info = '';
  if (first){
    if (ex.hint) info += `<div class="meta">${esc(ex.hint)}</div>`;
    const prev = lastEntry(id, s.id, locOf(s));
    if (prev){
      const p = prev.e, reps = p.sets.filter(x => x.done).map(x => x.reps).join(', ');
      info += `<div class="last">Letztes Mal ${LOC_AT[locOf(s)]}: ${reps} ${unitTxt(id)}${p.load ? `, ${esc(p.load)} ${esc(loadUnit(id, p))}` : ''}${p.tool ? ` (${esc(p.tool)})` : ''}${p.variant ? `, ${esc(p.variant)}` : ''}</div>`;
      if (reachedTop(id, p)) info += `<div class="last up">Überall 12 geschafft: mehr Gewicht oder schwierigere Variante, wieder ab 6 Wdh.</div>`;
    }
  }
  const right = [isSide(id, e) ? 'pro Seite' : '', !first && e.tool ? esc(e.tool) : '', !first && e.variant ? esc(e.variant) : ''].filter(Boolean).join(', ');
  return `<div class="row ${set.done ? 'done' : ''}">
    <div class="top"><span class="name">${esc(ex.name)}${label ? ` <span class="meta">${label}</span>` : ''}</span><span class="meta">${right}</span></div>
    ${info}
    <div class="ctrl">
      <div class="stepper">
        <button data-act="dec" data-ex="${id}" data-i="${i}" aria-label="weniger">−</button>
        <output>${set.reps}</output>
        <button data-act="inc" data-ex="${id}" data-i="${i}" aria-label="mehr">+</button>
      </div><span class="meta">${unitTxt(id)}</span>
      ${ex.load ? `<label class="loadwrap"><input class="load" inputmode="${ex.text ? 'text' : 'decimal'}" data-field="load" data-ex="${id}" value="${esc(e.load)}" placeholder="–" aria-label="Gewicht oder Band, ${esc(ex.name)}"><span class="meta">${esc(loadUnit(id, e))}</span></label>` : ''}
      <button class="check" data-act="done" data-ex="${id}" data-i="${i}" aria-pressed="${set.done}" aria-label="${esc(ex.name)} erledigt">✓</button>
    </div>
    ${ex.tools && first ? `<select class="variant" data-field="tool" data-ex="${id}" aria-label="Womit, ${esc(ex.name)}"><option value="" ${!e.tool?'selected':''}>Womit? (Kurzhantel, Kettlebell …)</option>${TOOLS.map(t => `<option ${t===e.tool?'selected':''}>${t}</option>`).join('')}</select>` : ''}
    ${ex.variants && first ? `<select class="variant" data-field="variant" data-ex="${id}" aria-label="Variante ${esc(ex.name)}">${ex.variants.map(v => `<option ${v===e.variant?'selected':''}>${esc(v)}</option>`).join('')}</select>` : ''}
  </div>`;
}
const machineRows = (s, id) => s.entries[id].sets.map((_, i) => row(s, id, i, i === 0, `Satz ${i+1}${i===2?' (optional)':''}`)).join('');

function renderSession(s){
  const u = UNITS[s.unit];
  let h = `<header class="sess-head"><div class="letter-sm" aria-hidden="true">${s.unit}</div>
    <div><h1>Einheit ${s.unit}</h1><p class="meta">${fmtDate(s.date)}, ${LOC[locOf(s)]}</p></div></header>
    <div class="field"><span>Runden im Zirkel</span>${roundsSeg(s.rounds)}</div>`;
  h += s.stopped
    ? `<div class="alert" role="alert">Training wegen Schmerzen im Sprunggelenk beendet. Bitte gib Lele Bescheid. Unten kannst du die Einheit trotzdem speichern.</div>`
    : `<button class="painbtn" data-act="pain">Schmerzen im Sprunggelenk</button>`;
  h += `<div class="row ${s.warmup ? 'done' : ''}"><div class="top"><span class="name">Aufwärmen</span></div>
    <div class="ctrl"><span class="meta">5–10 Minuten, z. B. am Rad</span><button class="check" data-act="warmup" aria-pressed="${s.warmup}" aria-label="Aufwärmen erledigt">✓</button></div></div>`;
  const gym = locOf(s) === 'gym';
  if (!gym && (u.pre.length || u.post.length)) h += `<p class="meta" style="margin-top:14px">Die Geräteübungen (${[...u.pre, ...u.post].map(id => EX[id].name).join(', ')}) sind nur im Studio dabei. Ob es daheim einen Ersatz gibt, klärst du mit Lele.</p>`;
  if (gym && u.pre.length) h += group('Am Gerät, zuerst', '2–3 Sätze, dann geht es in den Zirkel', u.pre.map(id => machineRows(s, id)).join(''));
  for (let r = 0; r < s.rounds; r++){
    h += group(`Runde ${r+1} von ${s.rounds}`,
      r === 0 ? 'Alle Übungen einmal hintereinander, 2–3 Min. Pause dazwischen' : 'Nach 2–4 Min. Pause',
      u.circuit.map(id => row(s, id, r, r === 0, '')).join(''));
  }
  if (gym && u.post.length) h += group('Am Gerät, zum Schluss', '2–3 Sätze extra', u.post.map(id => machineRows(s, id)).join(''));

  const feels = ['gut','mittel','schlecht'], pains = ['keine','leicht','deutlich'];
  h += `<section class="card"><h2>Einheit abschließen</h2>
    <div class="field"><span>Tagesverfassung</span><div class="seg">${feels.map(f => `<button data-act="feel" data-v="${f}" aria-pressed="${s.feel===f}">${f}</button>`).join('')}</div></div>
    <div class="field"><span>Sprunggelenk</span><div class="seg">${pains.map(f => `<button data-act="painlvl" data-v="${f}" aria-pressed="${s.pain===f}">${f}</button>`).join('')}</div></div>
    ${s.pain === 'deutlich' && !s.stopped ? `<p class="warntext">Bei Schmerzen im Sprunggelenk: aufhören und Lele Bescheid geben.</p>` : ''}
    <label class="field col"><span>Notiz, z. B. für Lele</span><textarea data-field="note" rows="3">${esc(s.note)}</textarea></label>
    <button class="btn wide" data-act="finish">Einheit speichern</button>
    <button class="link danger" data-act="discard">${armed === 'discard' ? 'Wirklich verwerfen? Nochmal tippen.' : 'Einheit verwerfen'}</button>
  </section>`;
  return h;
}

function sessionLines(s){
  return allEx(s.unit).map(id => {
    const e = s.entries[id]; if (!e) return null;
    const d = e.sets.filter(x => x.done); if (!d.length) return null;
    const ex = EX[id];
    return `${ex.name}: ${d.map(x => x.reps).join(', ')} ${unitTxt(id)}${isSide(id,e)?' pro Seite':''}${e.load ? `, ${e.load} ${loadUnit(id, e)}` : ''}${e.tool ? `, ${e.tool}` : ''}${e.variant ? ` (${e.variant})` : ''}`;
  }).filter(Boolean);
}
const summaryLine = s => `${LOC[locOf(s)]}, ${s.rounds} Runden, Verfassung ${s.feel || '–'}, Sprunggelenk ${s.pain || '–'}${s.stopped ? ', abgebrochen' : ''}`;

function buildExport(){
  const list = data.sessions.slice(-8);
  return 'Trainingsprotokoll\n\n' + list.map(s =>
    `${fmtDate(s.date)}, Einheit ${s.unit} (${summaryLine(s)})\n` +
    sessionLines(s).map(l => '  ' + l).join('\n') +
    (s.note ? `\n  Notiz: ${s.note}` : '')
  ).join('\n\n');
}

function renderHistory(){
  if (!data.sessions.length){
    return `<div class="empty"><h1>Noch keine Einheiten</h1>
      <p>Sobald du eine Einheit speicherst, steht sie hier mit allen Wiederholungen und Gewichten.</p>
      <button class="btn" data-act="view" data-v="today">Zur nächsten Einheit</button></div>${backupCard()}`;
  }
  let h = `<div class="hist-head"><h1>Verlauf</h1><button class="btn ghost" data-act="export">Für Lele zusammenfassen</button></div>`;
  if (exportText !== null){
    h += `<div class="card"><p class="meta">Die letzten Einheiten als Text, z. B. für eine Nachricht an Lele.</p>
      <textarea id="exp" readonly rows="10">${esc(exportText)}</textarea>
      <button class="btn ghost" data-act="copy" style="margin-top:8px">Kopieren</button></div>`;
  }
  h += backupCard();
  h += data.sessions.slice().reverse().map(s => `
    <details class="card hist" data-id="${s.id}" ${openIds.has(s.id) ? 'open' : ''}>
      <summary><span class="hl" style="color:var(--${s.unit.toLowerCase()})">${s.unit}</span>
        <span><strong>${fmtDate(s.date)}</strong><br><span class="meta">${esc(summaryLine(s))}</span></span></summary>
      <div class="detail">
        ${sessionLines(s).map(l => `<div>${esc(l)}</div>`).join('') || '<div class="meta">Keine Sätze abgehakt.</div>'}
        ${s.note ? `<p class="note">${esc(s.note)}</p>` : ''}
        <button class="link danger" data-act="del" data-id="${s.id}">${armed === 'del' + s.id ? 'Wirklich löschen? Nochmal tippen.' : 'Einheit löschen'}</button>
      </div>
    </details>`).join('');
  return h;
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click', e => {
  if (!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(_){} }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, s = data.active, id = b.dataset.ex, i = +b.dataset.i;
  const prevArmed = armed;
  armed = null;

  switch (act){
    case 'view': view = b.dataset.v; exportText = null; break;
    case 'rounds': { const n = +b.dataset.n; if (s) { setRounds(s, n); save(); } else startRounds = n; break; }
    case 'start':
      data.active = newSession(b.dataset.unit, startRounds, startLoc); save();
      window.scrollTo(0, 0); break;
    case 'loc': startLoc = b.dataset.v; break;
    case 'warmup': s.warmup = !s.warmup; save(); break;
    case 'inc': case 'dec': {
      const set = s.entries[id].sets[i], step = EX[id].time ? 5 : 1;
      set.reps = Math.max(0, set.reps + (act === 'inc' ? step : -step)); save(); break;
    }
    case 'done': {
      const set = s.entries[id].sets[i]; set.done = !set.done;
      if (set.done){ const r = restFor(s, id, i); if (r) startTimer(r); else { stopTimer(); setStatus('Letzte Runde geschafft. Unten kannst du die Einheit abschließen.'); } }
      save(); break;
    }
    case 'pain':
      s.stopped = true; s.pain = 'deutlich'; stopTimer(); save(); window.scrollTo(0, 0); break;
    case 'feel': s.feel = b.dataset.v; save(); break;
    case 'painlvl': s.pain = b.dataset.v; save(); break;
    case 'finish':
      data.sessions.push(s); data.active = null; startRounds = s.rounds; startLoc = locOf(s); stopTimer(); save();
      setStatus(`Einheit ${s.unit} gespeichert.`); window.scrollTo(0, 0); break;
    case 'discard':
      if (prevArmed === 'discard'){ data.active = null; stopTimer(); save(); setStatus('Einheit verworfen.'); window.scrollTo(0, 0); }
      else armed = 'discard';
      break;
    case 'del': {
      const key = 'del' + b.dataset.id;
      if (prevArmed === key){ data.sessions = data.sessions.filter(x => x.id !== b.dataset.id); exportText = null; save(); setStatus('Einheit gelöscht.'); }
      else armed = key;
      break;
    }
    case 'export': exportText = buildExport(); break;
    case 'backup': exportBackup(); return;
    case 'restore': document.getElementById('restoreFile').click(); return;
    case 'copy': {
      const ta = document.getElementById('exp');
      (navigator.clipboard ? navigator.clipboard.writeText(exportText) : Promise.reject())
        .then(() => setStatus('Kopiert.'))
        .catch(() => { ta.focus(); ta.select(); setStatus('Text ist markiert, bitte manuell kopieren.'); });
      return;
    }
    case 'tplus': timer.end += 30000; timer.total += 30; timer.rang = false; updTimer(); return;
    case 'tstop': stopTimer(); return;
  }
  render();
});

document.addEventListener('input', e => {
  const f = e.target.dataset.field, s = data.active; if (!f || !s) return;
  if (f === 'note') s.note = e.target.value;
  if (f === 'load') s.entries[e.target.dataset.ex].load = e.target.value;
  save();
});
document.addEventListener('change', e => {
  if (e.target.id === 'restoreFile'){ const file = e.target.files && e.target.files[0]; if (file) importBackup(file); e.target.value = ''; return; }
  const f = e.target.dataset.field, s = data.active; if (!f || !s) return;
  if (f === 'variant'){ s.entries[e.target.dataset.ex].variant = e.target.value; save(); render(); }
  if (f === 'tool'){ s.entries[e.target.dataset.ex].tool = e.target.value; save(); render(); }
  if (f === 'load') render();
});
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.dataset || !d.dataset.id) return;
  d.open ? openIds.add(d.dataset.id) : openIds.delete(d.dataset.id);
}, true);

(async () => {
  await loadData();
  const last = data.sessions[data.sessions.length - 1];
  if (last){ startRounds = last.rounds || 2; startLoc = locOf(last); }
  render();
})();
</script>
</body>
</html>
